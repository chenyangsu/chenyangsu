name: contribution snake

# Redraws the snake from the contribution graph, frames it in a card that matches
# assets/hero.svg (scripts/style_snake.py), and publishes it to the `output` branch.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            raw/snake.svg?palette=github-dark&color_snake=#e3b341&color_dots=#161b22,#16325c,#1f4f8f,#3b78c9,#79b0ff

      - name: frame the snake
        run: |
          pip install --quiet fonttools
          mkdir -p dist
          python3 scripts/style_snake.py raw/snake.svg dist/snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
