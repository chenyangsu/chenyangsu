name: hero and snake

# Every hour: redraw the contribution snake (Platane/snk, framed by scripts/style_snake.py) and rebuild
# the hero with the founder quotes in a fresh random order (scripts/build.py with QUOTE_SEED), then
# publish both to the `output` branch, which README.md reads from.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            raw/snake.svg?palette=github-dark&color_snake=#e3b341&color_dots=#161b22,#16325c,#1f4f8f,#3b78c9,#79b0ff

      - name: frame the snake and build the hero
        run: |
          pip install --quiet fonttools
          mkdir -p dist
          python3 scripts/style_snake.py raw/snake.svg dist/snake.svg
          python3 scripts/build.py
          cp assets/hero.svg assets/hero-mobile.svg dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUOTE_SEED: ${{ github.run_id }}-${{ github.run_attempt }}

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
